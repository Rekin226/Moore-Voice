[project]
name = "moore-voice"
version = "0.1.0"
description = "Open translation and speech recognition for Mooré (mos_Latn)"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = [
    "datasets>=2.20",
    "pandas>=2.0",
    "pyarrow>=15",
    "huggingface_hub>=0.24",
]

[project.optional-dependencies]
train = [
    "transformers>=4.44",
    "peft>=0.11",
    "torch>=2.3,<3",
    "sentencepiece",
    "protobuf",
    "accelerate>=0.30",
    "bitsandbytes>=0.43",
    "sacrebleu>=2.4",
]
asr = [
    "librosa",
    "soundfile",
    "jiwer",
    "evaluate",
]
dev = [
    "pytest>=8",
    "ruff>=0.5",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["moore_voice"]
